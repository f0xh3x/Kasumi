[package]
name = "statusnotch"
version = "0.1.0"
description = "Notch-style status bar for Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }  # keep key order when rewriting config sections
toml = "0.8"
notify = "6"
ureq = "2"
windows-core = "0.61"   # needed by the COM #[implement] macro
wmi = "0.18.4"
base64 = "0.22"
toml_edit = "0.25.15"

[dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Networking_Connectivity",
  "Media_Control",
  "Storage_Streams",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_Foundation",
  "Win32_Devices_Display",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
