# StatusNotch config. Hot-reloaded on save.
# All sizes are logical px (DIPs) and scale with each monitor's DPI.

[timing]
poll_ms = 16       # cursor poll interval
dwell_ms = 10      # how long the cursor must rest on a trigger zone before opening
grace_ms = 300     # how long the cursor may be outside the bar before closing
edge_px = 8        # cursor must be within this distance of the edge (notch hover)

[general]
hide_in_fullscreen = true # hide the notch while a game or video is fullscreen
rounded_corners = false   # round the monitors' corners
corner_radius = 10        # px
corners_attached = true   # part of the bars (their tint, opacity, animations) | false: black, fixed
tooltips = true           # hints when hovering widgets

[shell]
hide_taskbar = true       # hide the Windows taskbar while StatusNotch runs (restored on quit)

# App launcher: opens from the launcher widget, or with the hotkey (from the
# middle of the dock / bar when no launcher widget is placed). hotkey = "" for
# none; start_menu = true: the Windows key opens it instead of the Start menu.
[launcher]
enabled = true
hotkey = "Win+Alt+Space"
start_menu = false

[theme]
background = "#000000"
opacity = 100             # percent: bars, notches and panels (text stays solid)
text = "#ffffff"
dim_opacity = 0.45        # secondary text
accent = "#ffffff"
warn = "#ff9f43"           # hot temperatures
accent_details = false    # widget details (hover, the task line, sliders...) in the accent colour
font_size = 13

[geometry]
expanded_height = 30      # full-width bar height when open (same as the notch)
corner_radius = 14        # bottom corners of the bar while it spreads (square at the screen edges)
concave_radius = 33       # width of the flare from the edge into the notch's slanted middle
notch_height = 30         # default collapsed notch height (per-notch override: height)
notch_corner_radius = 25.5 # width of the round-off from the slanted middle into the tip
panel_concave_radius = 10  # popups (calendar, menu): fillet where they leave the bar
panel_corner_radius = 12   # popups: bottom corners

[animation]
# Springs: higher stiffness = faster, lower damping = more bounce.
expand_stiffness = 3440   # vertical: bar dropping down
expand_damping = 92
spread_stiffness = 2120   # horizontal: bar spreading out of the notches (style = "spread")
spread_damping = 80
panel_stiffness = 775     # panels (calendar) dropping out of a notch
panel_damping = 43
mass = 1
style = "drop"            # drop: bar slides out of the top edge | spread: grows sideways out of the notches
panel_content = "reveal"   # panels' content: slide (with the panel's edge) | reveal (stays, uncovered) | fade (stays, fades in)
bar_content = "reveal"     # the open bar's widgets: the same choices
open_speed = 1            # faster (> 1) or slower opening
close_speed = 1           # ... and closing
hover_nudge = true       # a notch grows a little as the cursor comes near
# Widget effects (each widget can differ: [widgets.<name>] anim_cascade /
# anim_roll / anim_magnify / anim_nudge = true | false):
cascade = true           # a panel shows its content one piece after another
rolling = true           # numbers roll to their new value
magnify = true           # dock icons grow under the cursor
marker_glide = true      # the line under the app in front travels to the next one
notification_nudge = true # the bell shakes for a new notification

# On-screen display: the notch grows into a pill showing the new level.
[osd]
enabled = true
screen = "cursor"           # where pop-ups appear: cursor | main | all | others | a monitor's name
spot = "top-center"          # which notch grows: top|bottom - left|center|right (each pop-up can have its own: volume_screen, notification_spot...)
width = 230
height = 34
duration_ms = 1500
volume_step = 2              # percent per volume key press
replace_volume_keys = true   # take over the volume keys; the Windows volume flyout won't show
brightness = true            # built-in panel brightness (Fn keys)
keyboard = true              # pop a small notch at the language widget when the keyboard layout changes
keyboard_width = 120
caps_lock = false            # pop the OSD when Caps Lock is switched on / off

# Bar spacing (widgets in the open bar).
[bar]
padding = 18
gap = 18

# Heights (px) of the named sizes docks rest and open at.
[sizes]
tiny = 12
small = 30
medium = 45
large = 60

# Bars and docks. Each has an edge (top | bottom), a mode (bar: notches open into
# the full-width bar | dock: notches grow in place) and its widgets: a side for
# every shown widget, and which of them show as their own notch on that side.
# A widget listed in no side isn't shown.
[surfaces.top]
mode = "bar"               # bar | dock | always (always shown, no notches)
reserve_space = false      # keep the bar's strip of the screen (maximized windows stop at it)
hot_left = true            # hot corners: resting the cursor there opens the bar
hot_right = false
hot_edge = false           # anywhere along the bar's edge
hot_corner_size = 12
hot_edge_size = 2
left = ["menu"]
center = ["clock"]
right = ["buttons"]
notch = ["clock"]

# The dock: rests small at the bottom, grows to medium on hover.
[surfaces.bottom]
edge = "bottom"
mode = "dock"
rest = "small"               # tiny | small | medium | large
open = "medium"
left = []
center = ["tasks", "tray", "quick"]
right = []
notch = []

# Notches: widgets listed in [layout] notch show as a notch on their side.
[notch]
merge = true              # notch widgets on the same side share one notch
combine_overlapping = true # notches that would touch are drawn as one

[notch.left]
hug = true                # sit in the corner
avoid_windows = true      # move aside while a window's caption buttons are there
offset = 150              # px from the edge when moved aside / not hugging

[notch.right]
hug = true
avoid_windows = true
offset = 150

[notch.center]
offset = 0                # shift from the middle

# Per-monitor rules; first match wins. match = "*", "primary", "#2" (index, left to right),
# a device name, or part of the monitor's friendly name (e.g. "DELL").
# enabled = false hides StatusNotch there; surfaces = { top = { left = [...], ... } } gives a
# monitor its own layout for a surface, surfaces = { bottom = { enabled = false } } turns one off.
[[monitors]]
match = "*"

[widgets.clock]
format = "%H:%M"

# CPU/GPU temperatures from LibreHardwareMonitor's remote web server
# (Options > Remote Web Server). Pick your sensors in Settings > Widgets > PC temps.
[widgets.temps]
enabled = false
url = "http://localhost:8085/data.json"     # or set port = 8085
cpu_sensor = "/amdcpu/0/temperature/2"       # SensorId from data.json (Core Tctl/Tdie)
gpu_sensor = "/gpu-nvidia/0/temperature/0"   # GPU Core
interval_ms = 1000
warn = 90                                    # readings at or above this turn orange
# Extra readings for the temps panel (SensorIds from data.json):
cpu_load = "/amdcpu/0/load/0"
cpu_power = "/amdcpu/0/power/0"
cpu_clock = "/amdcpu/0/clock/1"
gpu_load = "/gpu-nvidia/0/load/0"
gpu_power = "/gpu-nvidia/0/power/0"
vram_used = "/gpu-nvidia/0/smalldata/1"
vram_total = "/gpu-nvidia/0/smalldata/2"
ram_used = "/ram/data/0"
ram_available = "/ram/data/1"

# Now playing from the Windows media session (Spotify, browsers, ...).
[widgets.media]
enabled = false
max_width = 240                              # px for "title — artist" before it ellipsizes
scroll = true                                # long titles scroll instead of ending in "…"

# Open-Meteo, no API key. Pick your city in Settings > Widgets > Weather.
[widgets.weather]
enabled = false
location = "Vilnius"
latitude = 54.68916
longitude = 25.2798
units = "metric"                             # metric | imperial
interval_min = 15
hours = 8                                    # hours shown in the weather panel

# Notification-area icons, hosted from apps' Shell_NotifyIcon calls (Explorer's tray keeps working).
[widgets.tray]
mode = "collapsed"                           # collapsed: a button + panel | expanded: every icon in the bar
icons_per_row = 5
hide = ["explorer.exe"]                      # process names whose icons are left out

# Hamburger menu. action: "open" (a path or shell: folder), "settings", "sleep",
# "lock", "restart", "shutdown". confirm = true needs a second click within 3 s.
[widgets.menu]
width = 210
items = [
  { label = "This PC", icon = "\uE7F4", action = "open", target = "shell:MyComputerFolder" },
  { label = "Downloads", icon = "\uE896", action = "open", target = "~/Downloads" },
  { label = "Documents", icon = "\uE8A5", action = "open", target = "~/Documents" },
  { label = "Pictures", icon = "\uEB9F", action = "open", target = "~/Pictures" },
  { label = "Recycle bin", icon = "\uE74D", action = "open", target = "shell:RecycleBinFolder" },
  { separator = true },
  { label = "Settings", icon = "\uE713", action = "settings" },
  { separator = true },
  { label = "Sleep", icon = "\uE708", action = "sleep" },
  { label = "Restart", icon = "\uE777", action = "restart", confirm = true },
  { label = "Shut down", icon = "\uE7E8", action = "shutdown", confirm = true },
  { label = "Lock", icon = "\uE72E", action = "lock" },
]

# Keyboard layout indicator (click to switch).
[widgets.language]
enabled = false

# Your own buttons in the bar (same actions as the menu).
[widgets.buttons]
items = [
  { label = "Settings", icon = "", action = "settings" },
  { label = "Restart", icon = "", action = "restart", confirm = true },
  { label = "Shut down", icon = "", action = "shutdown", confirm = true },
]
