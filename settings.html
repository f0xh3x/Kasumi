<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>StatusNotch Settings</title>
  </head>
  <body>
    <header class="titlebar" data-tauri-drag-region>
      <div class="titlebar-title" data-tauri-drag-region>StatusNotch</div>
      <div class="titlebar-buttons">
        <button id="tb-min" class="tb" title="Minimize"><span class="icon">&#xE921;</span></button>
        <button id="tb-max" class="tb" title="Maximize"><span class="icon">&#xE922;</span></button>
        <button id="tb-close" class="tb close" title="Close"><span class="icon">&#xE8BB;</span></button>
      </div>
    </header>
    <div id="app"></div>
    <div id="toast"></div>
    <script>
      // Page errors go to the app log. Inline and first, so it also catches the page's
      // own code failing to load (it once failed silently: nothing drawn, nothing logged).
      const logError = (message) => window.__TAURI_INTERNALS__?.invoke("fe_log", { message }).catch(() => {});
      addEventListener("error", (e) => logError(`${e.message} @ ${e.filename}:${e.lineno}`));
      addEventListener("unhandledrejection", (e) => logError(`unhandled: ${e.reason}`));
    </script>
    <script type="module" src="/src/settings/main.ts"></script>
  </body>
</html>
