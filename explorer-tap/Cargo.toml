[package]
name = "kasumi-explorer"
version = "0.1.0"
edition = "2021"
description = "Kasumi's library inside File Explorer: hides parts of its XAML header ([explorer] hide)"
license = "Unlicense"

[lib]
name = "kasumi_explorer"
crate-type = ["cdylib"]

# Its own build (not part of the app's).
[workspace]

[dependencies]
windows-core = "0.61"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Accessibility",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_System_Threading",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Never abort inside Explorer: every entry point catches its panics.
panic = "unwind"
