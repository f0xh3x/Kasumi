# Kasumi native test: a top bar and a bottom dock drawn with Windows' own Direct2D / DirectWrite on
# layered windows (no WebView2), to measure how light the bars could be. Not part
# of Kasumi: its own build, `cargo build --release` here.
[package]
name = "kasumi-native-test"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
windows-numerics = "0.2"
toml = "0.8"  # reads Kasumi's config.toml (geometry, springs, font)

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Variant",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
