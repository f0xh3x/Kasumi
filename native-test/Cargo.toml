# Kasumi native test: one top bar drawn with Windows' own Direct2D / DirectWrite on
# a layered window (no WebView2), to measure how light the bars could be. Not part
# of Kasumi: its own build, `cargo build --release` here.
[package]
name = "kasumi-native-test"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
windows-numerics = "0.2"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
